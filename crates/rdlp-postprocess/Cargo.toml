[package]
name = "rdlp-postprocess"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Post-processing pipeline for rdlp (FFmpeg operations, metadata embedding, etc.)"

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-ffmpeg = { path = "../rdlp-ffmpeg" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { version = "1", features = ["v4"] }

# MP4 iTunes metadata (covr atom for Windows Explorer thumbnails)
mp4ameta = "0.13"

# Advisory file locking for TempRegistry crash-safe cleanup (same version as rdlp-api)
fs4 = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
filetime = "0.2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
must_use_candidate = "warn"
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# `Duration::from_mins` / `from_hours` were stabilized in Rust 1.95; MSRV is 1.85.
duration_suboptimal_units = "allow"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
