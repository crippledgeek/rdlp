[package]
name = "rdlp-downloader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-http = { path = "../rdlp-http" }
rdlp-ratelimit = { path = "../rdlp-ratelimit" }
rdlp-security = { path = "../rdlp-security" }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
wreq = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
backon = { workspace = true }
m3u8-rs = "6.0"
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dash-mpd = { workspace = true }
rdlp-ffmpeg = { path = "../rdlp-ffmpeg" }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockito = { workspace = true }
proptest = "1.4"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
fn_params_excessive_bools = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
