[package]
name = "rdlp-ffmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "FFmpeg library bindings wrapper for rdlp (probing, remuxing, transcoding, metadata, thumbnails)"

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# FFmpeg library bindings (FFmpeg 5-8)
ffmpeg-the-third = "4.1"

# Explicit OpenSSL link for FFmpeg's tls_openssl.o (libavformat.a).
# FFmpeg static archives reference DTLS_get_data_mtu / EVP_PKEY_Q_keygen /
# SSL_CTX_ctrl which must resolve to system OpenSSL, not to BoringSSL
# (which wreq uses via prefix-symbols-isolated boring-sys). openssl-sys's
# build.rs emits cargo:rustc-link-lib=ssl/crypto so rustc appends them to
# the link line after rlib archives.
openssl-sys = { workspace = true }

[features]
# Gates `ffmpeg::test_support` (in-process fixture synthesis) — needs the
# crate's private FFI helpers, so it lives in `src/` and exists purely for
# tests. Enabled from this crate's own [dev-dependencies] (self-dev-dep
# trick) and from sibling crates' dev-dependencies; MUST NEVER reach a
# release binary — enforced by
# scripts/check-test-only-features-not-in-release.sh.
test-support = []

[dev-dependencies]
rdlp-ffmpeg = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
strum = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# `ffmpeg::init_ok` answers whether FFmpeg is safe to call at all: dropping its
# answer resumes the wrong-offset FFI reads the ABI check exists to stop (#656).
# Denied rather than left at rustc's default `warn` so the guarantee holds
# without the `-D warnings` gate, not only under it.
unused_must_use = "deny"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
fn_params_excessive_bools = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
