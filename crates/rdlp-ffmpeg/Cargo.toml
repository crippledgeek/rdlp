[package]
name = "rdlp-ffmpeg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FFmpeg library bindings wrapper for rdlp (probing, remuxing, transcoding, metadata, thumbnails)"

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
tokio = { workspace = true, features = ["fs", "io-util"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

# FFmpeg library bindings (FFmpeg 5-8)
ffmpeg-the-third = "4.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
