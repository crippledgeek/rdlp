[package]
name = "rdlp-probe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authoring toolkit for rdlp extractors. Fetches pages, runs JavaScript, applies extraction patterns — all through the same HTTP and JS stacks the production extractors use."

[dependencies]
rdlp-types = { path = "../rdlp-types" }
rdlp-http = { path = "../rdlp-http" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-core = { path = "../rdlp-core" }
wreq = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-std"] }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
scraper = { workspace = true }
regex = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
