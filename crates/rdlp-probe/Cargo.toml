[package]
name = "rdlp-probe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Authoring toolkit for rdlp extractors. Fetches pages, runs JavaScript, applies extraction patterns — all through the same HTTP and JS stacks the production extractors use."

[dependencies]
rdlp-types = { path = "../rdlp-types" }
rdlp-http = { path = "../rdlp-http" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-core = { path = "../rdlp-core" }
wreq = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-std"] }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
scraper = { workspace = true }
regex = { workspace = true }

# Per-crate lint config — extends workspace lints (which cannot be composed
# with workspace = true once per-crate tables are added).
# Workspace lint baselines replicated here:
#   clippy::must_use_candidate = warn
#   clippy::await_holding_lock = deny
#   clippy::await_holding_refcell_ref = deny
#   clippy::disallowed_methods = deny

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
# Workspace baseline (replicated — cannot use workspace = true alongside
# per-crate tables).
must_use_candidate = "warn"
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Security-relevant lints applied to ALL targets.
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# `indexing_slicing`, `pedantic`, and `nursery` are binary-only via
# `#![warn(...)]` in `src/main.rs`.
