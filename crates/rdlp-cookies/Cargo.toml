[package]
name = "rdlp-cookies"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
async-trait = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
wreq = { workspace = true }
url = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
missing_docs = "warn"
# unsafe_code: Windows CryptUnprotectData FFI requires unsafe (DPAPI on Windows)

[lints.clippy]
# Workspace baseline
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
# Security lints
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
