[package]
name = "rdlp-cookies"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
async-trait = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
wreq = { workspace = true }
url = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

# Chrome v11 cookies on Linux are encrypted under a key held in the login
# keyring; secret-service reads it over the org.freedesktop.secrets D-Bus API.
# Linux-only: macOS uses the Keychain (unimplemented) and Windows uses DPAPI.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# unsafe_code: intentionally NOT set to forbid — Windows DPAPI
# CryptUnprotectData FFI requires unsafe blocks on the Windows target.
[lints]
workspace = true
