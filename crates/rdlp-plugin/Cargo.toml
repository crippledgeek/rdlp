[package]
name = "rdlp-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-plugin-manifest = { path = "../rdlp-plugin-manifest" }
rdlp-http = { path = "../rdlp-http" }
rdlp-cookies = { path = "../rdlp-cookies" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-security = { path = "../rdlp-security" }

# WASM runtime
wasmtime = { version = "30", features = ["component-model", "async"] }

# Signing
sigstore = { version = "0.13", default-features = false, features = ["sigstore-trust-root", "rustls-tls", "verify"] }
ed25519-dalek = { version = "2", features = ["std", "pem"] }

# Parsing & dispatch
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
scraper = { workspace = true }
psl = "2"

# Storage
sled = "0.34"

# Errors / async
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }

# Misc
semver = { version = "1", default-features = false }
sha2 = "0.10"
hex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
rdlp-extractor = { version = "0.1.0", path = "../rdlp-extractor" }
rdlp-redact = { workspace = true }
# Optional: only pulled in by the `test-support` feature below. `pub mod
# test_support` (not `cfg(test)`) needs these at compile time even though
# it exists purely for tests — see that module's doc and
# scripts/check-test-only-features-not-in-release.sh.
temp-env = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[features]
# Gates `test_support`'s signer/identity/config-dir-isolation helpers,
# which need `temp-env`/`tempfile`/`rand` at compile time despite existing purely
# for tests (an integration test in ANOTHER crate links this lib as a
# regular dependency and can't see `cfg(test)` items — see
# `src/test_support.rs`'s module doc). Enabled from this crate's own
# `[dev-dependencies]` below (the standard self-dev-dep trick) and from
# `rdlp-api`'s dev-dependency on this crate. MUST NEVER be enabled by a
# release binary's non-dev dependency graph — that would link two
# test-only crates into every user's `rdlp`/`rdlp-desktop` binary for no
# runtime purpose; enforced by
# scripts/check-test-only-features-not-in-release.sh.
test-support = ["dep:temp-env", "dep:tempfile", "dep:rand"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wat = "1"
rand = { workspace = true }
mockito = { workspace = true }
rdlp-extractor = { path = "../rdlp-extractor", features = [
    "loopback-test-exemption",
    "test-support",
] }
# Self-dev-dependency: this crate's OWN tests/*.rs binaries link the lib as
# an external crate (same reason `test_support` isn't `cfg(test)`), so they
# need the feature enabled too, exactly like `rdlp-api`'s dev-dep on this
# crate below does.
rdlp-plugin = { path = ".", features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
fn_params_excessive_bools = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
