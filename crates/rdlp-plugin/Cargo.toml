[package]
name = "rdlp-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-http = { path = "../rdlp-http" }
rdlp-cookies = { path = "../rdlp-cookies" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-security = { path = "../rdlp-security" }

# WASM runtime
wasmtime = { version = "30", features = ["component-model", "async"] }
wasmtime-wasi = { version = "30" }

# Signing
sigstore = { version = "0.10", default-features = false, features = ["sigstore-trust-root"] }
ed25519-dalek = { version = "2", features = ["std", "pem"] }

# Parsing & dispatch
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
regex = { workspace = true }
scraper = { workspace = true }
psl = "2"

# Storage
sled = "0.34"

# Errors / async
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }

# Misc
sha2 = "0.10"
hex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wat = "1"
rand = "0.8.5"

[lints]
workspace = true
