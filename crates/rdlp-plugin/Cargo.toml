[package]
name = "rdlp-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-plugin-manifest = { path = "../rdlp-plugin-manifest" }
rdlp-http = { path = "../rdlp-http" }
rdlp-cookies = { path = "../rdlp-cookies" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-security = { path = "../rdlp-security" }

# WASM runtime
wasmtime = { version = "30", features = ["component-model", "async"] }

# Signing
sigstore = { version = "0.13", default-features = false, features = ["sigstore-trust-root", "rustls-tls", "verify"] }
ed25519-dalek = { version = "2", features = ["std", "pem"] }

# Parsing & dispatch
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
scraper = { workspace = true }
psl = "2"

# Storage
sled = "0.34"

# Errors / async
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }

# Misc
semver = { version = "1", default-features = false }
sha2 = "0.10"
hex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
percent-encoding = "2"
html-escape = "0.2.13"
rdlp-extractor = { version = "0.1.0", path = "../rdlp-extractor" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wat = "1"
rand = "0.8.5"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
fn_params_excessive_bools = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
