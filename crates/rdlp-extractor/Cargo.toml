[package]
name = "rdlp-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-security = { path = "../rdlp-security" }
rdlp-redact = { workspace = true }
rdlp-crypto = { path = "../rdlp-crypto" }
rdlp-http = { path = "../rdlp-http" }
anyhow = { workspace = true }
async-trait = { workspace = true }
dash-mpd = { workspace = true, default-features = false }
log = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
wreq = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
lazy-regex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
m3u8-rs = { workspace = true }
futures = { workspace = true }
urlencoding = "2"

[features]
# Widens the `#[cfg(test)]` mockito-loopback exemption in
# `base/common/manifest_url.rs` to non-test builds of THIS crate, so a
# sibling crate's own tests can drive expand_hls_in_place /
# expand_missing_hls_fragments against a mockito server. Enabled ONLY as a
# dev-dependency feature by rdlp-plugin and rdlp-api (both list
# `rdlp-extractor = { ..., features = ["loopback-test-exemption"] }` under
# `[dev-dependencies]`). Must never reach a production binary: `src/lib.rs`
# carries a `compile_error!` for a release build with it on, and
# scripts/check-test-only-features-not-in-release.sh proves no binary's
# non-dev graph enables it. Its cost is that `cargo test --workspace`
# unifies it into this crate's own test build — scripts/check-hls-seed-gate.sh
# runs the loopback-rejection tests in isolation for that reason.
loopback-test-exemption = []
# Gates `src/log_capture.rs`, the `log::Log` capture sink this crate's own
# unit tests and rdlp-plugin's share (rdlp-plugin lists it under
# `[dev-dependencies]`). No extra dependencies, but the same rule as
# `loopback-test-exemption`: enabled only from a dev-dependency, guarded by
# a `compile_error!` in `src/lib.rs` for a release build, and proved absent
# from every binary's non-dev graph by
# scripts/check-test-only-features-not-in-release.sh.
test-support = []

[dev-dependencies]
hex = { workspace = true }
# Only `tests/spankbang_live.rs` evaluates site JS; production extraction never does.
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
mockito = { workspace = true }
rdlp-cookies = { path = "../rdlp-cookies" }
strum = { workspace = true }

# Documentation-completeness rationale only — do NOT lift extractor-
# specific `#![warn(...)]` lints (declared in `src/lib.rs`) to workspace.
[lints]
workspace = true
