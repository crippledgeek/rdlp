[package]
name = "rdlp-extractor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-security = { path = "../rdlp-security" }
rdlp-redact = { workspace = true }
rdlp-crypto = { path = "../rdlp-crypto" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-http = { path = "../rdlp-http" }
anyhow = { workspace = true }
async-trait = { workspace = true }
dash-mpd = { workspace = true, default-features = false }
log = { workspace = true }
tokio = { workspace = true }
wreq = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
lazy-regex = { workspace = true }
url = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
m3u8-rs = { workspace = true }
futures = { workspace = true }
urlencoding = "2"
html-escape = "0.2.13"

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
mockito = { workspace = true }
rdlp-cookies = { path = "../rdlp-cookies" }

# Documentation-completeness rationale only — do NOT lift extractor-
# specific `#![warn(...)]` lints (declared in `src/lib.rs`) to workspace.
[lints]
workspace = true
