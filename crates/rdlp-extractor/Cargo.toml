[package]
name = "rdlp-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-security = { path = "../rdlp-security" }
rdlp-redact = { workspace = true }
rdlp-crypto = { path = "../rdlp-crypto" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-http = { path = "../rdlp-http" }
anyhow = { workspace = true }
async-trait = { workspace = true }
dash-mpd = { workspace = true, default-features = false }
log = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
wreq = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
lazy-regex = { workspace = true }
url = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
m3u8-rs = { workspace = true }
futures = { workspace = true }
urlencoding = "2"

[features]
# Widens the `#[cfg(test)]` mockito-loopback exemption in
# `base/common/manifest_url.rs` to non-test builds of THIS crate, so a
# sibling crate's own tests (rdlp-plugin, rdlp-api) can drive
# expand_hls_in_place / expand_missing_hls_fragments against a mockito
# server. Intended to be enabled ONLY as a dev-dependency feature in those
# sibling crates, added when the plugin host's own tests need it — nothing
# references it yet. Must never reach a production binary; see
# scripts/check-loopback-feature-not-in-release.sh.
loopback-test-exemption = []

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
mockito = { workspace = true }
rdlp-cookies = { path = "../rdlp-cookies" }
strum = { workspace = true }

# Documentation-completeness rationale only — do NOT lift extractor-
# specific `#![warn(...)]` lints (declared in `src/lib.rs`) to workspace.
[lints]
workspace = true
