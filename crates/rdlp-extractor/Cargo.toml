[package]
name = "rdlp-extractor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-security = { path = "../rdlp-security" }
rdlp-crypto = { path = "../rdlp-crypto" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
anyhow = { workspace = true }
async-trait = { workspace = true }
dash-mpd = { workspace = true, default-features = false }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
wreq = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
lazy-regex = { workspace = true }
url = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
m3u8-rs = { workspace = true }
futures = { workspace = true }
urlencoding = "2"

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
mockito = { workspace = true }
rdlp-http = { path = "../rdlp-http" }
rdlp-cookies = { path = "../rdlp-cookies" }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
# Workspace baseline (replicated — cannot use workspace = true alongside
# per-crate tables).
must_use_candidate = "warn"
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Documentation completeness (applies to all targets).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
