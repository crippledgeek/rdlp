[package]
name = "rdlp-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
serde = []  # Enables dto module; serde crate is always available for session_state

[dependencies]
rdlp-core = { path = "../rdlp-core" }
rdlp-types = { path = "../rdlp-types" }
rdlp-extractor = { path = "../rdlp-extractor" }
rdlp-downloader = { path = "../rdlp-downloader" }
rdlp-postprocess = { path = "../rdlp-postprocess" }
rdlp-ffmpeg = { path = "../rdlp-ffmpeg" }
rdlp-http = { path = "../rdlp-http" }
rdlp-cookies = { path = "../rdlp-cookies" }
rdlp-jsinterp = { path = "../rdlp-jsinterp" }
rdlp-security = { path = "../rdlp-security" }
rdlp-ratelimit = { path = "../rdlp-ratelimit" }
rdlp-redact = { workspace = true, features = ["log-kv"] }
rdlp-plugin = { path = "../rdlp-plugin" }

dirs = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
wreq = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
# Advisory file lock for the download archive so concurrent rdlp processes
# (or unit tests) cannot interleave append+read against the same file.
fs4 = "0.13"

# Always needed: session_state serialization + EventDto (when `serde` feature enabled)
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
temp-env = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
mockito = "1.7"
# For plugin-dispatch regression test (signs a manifest + wasm in setup).
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
base64 = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }

# Per-crate lint config — extends workspace lints (which cannot be composed
# with workspace = true once per-crate tables are added).
# Workspace lint baselines replicated here:
#   clippy::must_use_candidate = warn
#   clippy::await_holding_lock = deny
#   clippy::await_holding_refcell_ref = deny
#   clippy::disallowed_methods = deny

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
fn_params_excessive_bools = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
