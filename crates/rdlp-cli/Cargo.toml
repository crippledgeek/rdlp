[package]
name = "rdlp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rdlp"
path = "src/main.rs"

[dependencies]
# CLAUDE.md: rdlp-cli depends on rdlp-api as its primary facade. The
# remaining direct deps cover utilities that don't fit the facade —
# CLI-side table rendering, the codec-listing helper from rdlp-ffmpeg,
# and the rate-limit value parser.
rdlp-api = { path = "../rdlp-api" }
rdlp-redact = { workspace = true }
rdlp-plugin = { path = "../rdlp-plugin" }
rdlp-security = { path = "../rdlp-security" }
rdlp-table = { path = "../rdlp-table" }
rdlp-ffmpeg = { path = "../rdlp-ffmpeg" }
rdlp-ratelimit = { path = "../rdlp-ratelimit" }
rdlp-types = { path = "../rdlp-types" }
async-trait = { workspace = true }

dirs = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
wreq = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
inquire = { workspace = true }
futures-util = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
regex = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = "1.4"
temp-env = { workspace = true }
tempfile = "3.24"
mockito = "1.7"
wiremock = "0.6"
async-trait = { workspace = true }
regex = { workspace = true }
rdlp-plugin-manifest = { path = "../rdlp-plugin-manifest" }
testing_logger = "0.1.1"

# `indexing_slicing`, `pedantic`, and `nursery` are applied binary-only
# via `#![warn(...)]` in `src/main.rs` and `src/lib.rs` — do NOT lift
# them to the workspace table.
[lints]
workspace = true
