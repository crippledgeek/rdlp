# pnpm settings for the desktop frontend.
#
# pnpm reads settings ONLY from here (and from `.npmrc` for auth/registry). The
# `pnpm` block in package.json is no longer read at all as of v11 — do not
# "tidy" any of these keys back into package.json; they would be silently
# ignored.
#
# allowBuilds is the allowlist of dependencies permitted to run install
# scripts. pnpm refuses to run a dependency's build scripts unless it is listed
# here, and Cypress downloads its actual binary in postinstall. Unlisted, the
# install reports success and the binary silently never arrives — failing
# later, somewhere unrelated. That is the trap that bit us during the
# npm->pnpm migration.
#
# Keep entries UNPINNED (bare package names). A pinned entry like
# `esbuild@0.27.4` stops matching after a version bump and is then silently
# blocked — observed under the predecessor `onlyBuiltDependencies`
# (pnpm/pnpm#11219, pnpm/pnpm#10426, both still open against the v10 key); the
# same pin-matching design carries into `allowBuilds`.
#
# Replaced `onlyBuiltDependencies` on the v10 -> v11 upgrade (2026-07-21).
# v11 REMOVED all five predecessors — onlyBuiltDependencies,
# onlyBuiltDependenciesFile, neverBuiltDependencies, ignoredBuiltDependencies
# and ignoreDepScripts — in favour of this one map, where a `false` value is
# what neverBuilt/ignoredBuilt used to express.
allowBuilds:
  cypress: true
  esbuild: true

# strictDepBuilds makes an unreviewed install script a HARD ERROR
# (ERR_PNPM_IGNORED_BUILDS, exit 1) instead of a warning that scrolls past.
# It became the default in v11 (it was NOT on by default in 10.33.0 — verified
# empirically: the install warned and exited 0). Kept explicit so the guard
# survives a future default flip and stays greppable.
strictDepBuilds: true

# Force the guarded event client. `@tanstack/form-core` (via react-form) depends
# on 0.4.3, whose root export is the REAL EventClient — the NODE_ENV no-op that
# strips it from production was only added in 0.5.0. Left alone, `FormApi.mount()`
# registers live `form:request-form-force-submit` / `-reset` / `-state` listeners
# in the shipped bundle, a debug RPC surface reachable by any script running in
# the page. Bumping react-form does NOT fix this: 1.33.5, the latest, still
# depends on 0.4.3 — verified with `pnpm why`, and by measuring the built bundle.
overrides:
  # `^0.5.0`, not `>=0.5.0`: an open-ended floor would silently adopt a future
  # 0.6/1.0 whose API form-core may not match. This line changes runtime
  # behaviour, so it should track a pair that was actually tested together.
  #
  # Nothing will tell you when that stops being true. An override is an
  # UNCONDITIONAL replacement — pnpm neither errors nor warns when the forced
  # version falls outside a dependent's declared range. This entry is its own
  # proof: form-core declares `^0.4.1`, which for a 0.x package excludes 0.5.0
  # entirely, and the install resolves silently anyway. So if form-core later
  # moves to `^0.6.0`, this line will quietly DOWNGRADE it rather than
  # complain. The failure mode is staleness, not conflict — hence the revisit
  # trigger recorded in crates/rdlp-desktop/CLAUDE.md.
  #
  # One assumption holds the whole thing up: that consumers import the package
  # ROOT, which is what carries the NODE_ENV switch. 0.5.0 also publishes a
  # `/production` subpath that deliberately re-exports the REAL client and is
  # never stripped. Anything importing that subpath silently defeats this.
  "@tanstack/devtools-event-client": "^0.5.0"
