[package]
name = "rdlp-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "rdlp-desktop"

[[bin]]
name = "rdlp-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rdlp-api = { path = "../../rdlp-api", features = ["serde"] }
rdlp-ffmpeg = { path = "../../rdlp-ffmpeg" }
rdlp-types = { path = "../../rdlp-types" }
rdlp-core = { path = "../../rdlp-core" }
rdlp-postprocess = { path = "../../rdlp-postprocess" }
rdlp-security = { path = "../../rdlp-security" }
rdlp-http = { path = "../../rdlp-http" }
wreq = { workspace = true }
url = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mockito = { workspace = true }

# Per-crate lint config — extends workspace lints (which cannot be composed
# with workspace = true once per-crate tables are added).
# Workspace lint baselines replicated here:
#   clippy::must_use_candidate = warn
#   clippy::await_holding_lock = deny
#   clippy::await_holding_refcell_ref = deny
#   clippy::disallowed_methods = deny

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
# Workspace baseline (replicated — cannot use workspace = true alongside
# per-crate tables).
must_use_candidate = "warn"
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# `Duration::from_mins` / `from_hours` were stabilized in Rust 1.95; MSRV is 1.85.
duration_suboptimal_units = "allow"
# Strict surface for the Tauri IPC layer.
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# `indexing_slicing`, `pedantic`, and `nursery` are lib-only via
# `#![warn(...)]` in `src/lib.rs`. Test code inherits the
# `allow-unwrap-in-tests` / `allow-expect-in-tests` exemptions from
# `clippy.toml`.
