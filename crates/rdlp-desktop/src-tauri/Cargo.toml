[package]
name = "rdlp-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "rdlp-desktop"

[[bin]]
name = "rdlp-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rdlp-api = { path = "../../rdlp-api", features = ["serde"] }
rdlp-ffmpeg = { path = "../../rdlp-ffmpeg" }
rdlp-types = { path = "../../rdlp-types" }
rdlp-core = { path = "../../rdlp-core" }
rdlp-postprocess = { path = "../../rdlp-postprocess" }
rdlp-security = { path = "../../rdlp-security" }
rdlp-http = { path = "../../rdlp-http" }
wreq = { workspace = true }
url = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
log = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mockito = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
match_same_arms = "warn"
redundant_clone = "warn"
collapsible_match = "warn"
wrong_self_convention = "warn"
should_implement_trait = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
