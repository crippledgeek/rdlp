[workspace]
members = [
    "crates/rdlp-types",
    "crates/rdlp-core",
    "crates/rdlp-api",
    "crates/rdlp-http",
    "crates/rdlp-security",
    "crates/rdlp-crypto",
    "crates/rdlp-extractor",
    "crates/rdlp-downloader",
    "crates/rdlp-jsinterp",
    "crates/rdlp-ffmpeg",
    "crates/rdlp-postprocess",
    "crates/rdlp-cookies",
    "crates/rdlp-ratelimit",
    "crates/rdlp-table",
    "crates/rdlp-plugin",
    "crates/rdlp-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rdlp contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# HTTP and networking
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
url = "2.5"

# HTML/JSON parsing
scraper = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
m3u8-rs = "6.0"  # HLS playlist parser

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Retry logic
backon = { version = "1.6", features = ["tokio-sleep"] }

# JavaScript engine
boa_engine = "0.21"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.18.3"
dialoguer = "0.12.0"

# Logging
log = { version = "0.4", features = ["kv"] }
env_logger = { version = "0.11", features = ["kv"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "tracing-log"] }

# Configuration
toml = "0.9.11"

# Plugin system
libloading = "0.8"
inventory = "0.3"

# Cookie extraction
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

# Parsing
winnow = "0.7"

# Platform
dirs = "6.0"

# Utilities
regex = "1.11"
lazy_static = "1.5"
once_cell = "1.20"
futures = "0.3"
futures-util = "0.3"
bytes = "1.9"
hex = "0.4"

# Testing
mockito = "1.5"
tempfile = "3.14"

[workspace.lints.clippy]
must_use_candidate = "warn"
