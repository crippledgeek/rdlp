[workspace]
members = [
    "crates/rdlp-types",
    "crates/rdlp-core",
    "crates/rdlp-api",
    "crates/rdlp-http",
    "crates/rdlp-security",
    "crates/rdlp-crypto",
    "crates/rdlp-extractor",
    "crates/rdlp-downloader",
    "crates/rdlp-jsinterp",
    "crates/rdlp-ffmpeg",
    "crates/rdlp-postprocess",
    "crates/rdlp-cookies",
    "crates/rdlp-ratelimit",
    "crates/rdlp-table",
    "crates/rdlp-plugin",
    "crates/rdlp-cli",
    "crates/rdlp-desktop/src-tauri",
    "crates/rdlp-probe",
]
default-members = [
    "crates/rdlp-types",
    "crates/rdlp-core",
    "crates/rdlp-api",
    "crates/rdlp-http",
    "crates/rdlp-security",
    "crates/rdlp-crypto",
    "crates/rdlp-extractor",
    "crates/rdlp-downloader",
    "crates/rdlp-jsinterp",
    "crates/rdlp-ffmpeg",
    "crates/rdlp-postprocess",
    "crates/rdlp-cookies",
    "crates/rdlp-ratelimit",
    "crates/rdlp-table",
    "crates/rdlp-plugin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["rdlp contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# HTTP and networking
# wreq features:
# - cookies, json, stream: 1:1 with reqwest's feature set pre-migration
# - gzip, brotli, zstd: real browsers advertise all three; subset desyncs JA4H
# - socks: preserves --proxy SOCKS5 support
# - form: PornHub extractor needs x-www-form-urlencoded POST
# - prefix-symbols: isolates BoringSSL symbols from system OpenSSL to coexist
#   with OpenSSL-linked FFmpeg builds (matches upstream curl_cffi pattern).
#   Paired with an explicit openssl-sys dep below to ensure -lssl -lcrypto
#   lands on the linker command line after rlib archives.
wreq = { version = "6.0.0-rc.28", features = ["cookies", "json", "stream", "gzip", "brotli", "zstd", "socks", "form", "prefix-symbols"] }
wreq-util = "3.0.0-rc.10"
# Explicit OpenSSL link — required because FFmpeg's libavformat.a references
# OpenSSL symbols (DTLS_get_data_mtu, EVP_PKEY_Q_keygen, etc.) that BoringSSL
# doesn't provide. openssl-sys's build.rs emits cargo:rustc-link-lib=ssl/crypto
# which rustc appends after rlib archives, guaranteeing symbol resolution.
openssl-sys = "0.9"
url = "2.5"

# HTML/JSON parsing
scraper = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
m3u8-rs = "6.0"  # HLS playlist parser

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Retry logic
backon = { version = "1.6", features = ["tokio-sleep"] }

# JavaScript engine
boa_engine = "0.21"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.18.3"
inquire = "0.9"

# Table rendering
tabled = "0.20"
console = "0.16"
terminal_size = "0.4"

# Logging
log = { version = "0.4", features = ["kv"] }
env_logger = { version = "0.11", features = ["kv"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "tracing-log"] }

# Configuration
toml = "0.9.11"

# Plugin system
libloading = "0.8"
inventory = "0.3"

# Cookie extraction
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

# Enum derives
strum = "0.27"
strum_macros = "0.27"

# Parsing
winnow = "0.7"

# Platform
dirs = "6.0"

# Utilities
regex = "1.11"
lazy_static = "1.5"
futures = "0.3"
futures-util = "0.3"
bytes = "1.9"
hex = "0.4"

# Testing
mockito = "1.5"
tempfile = "3.14"

[workspace.lints.clippy]
must_use_candidate = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"

# ── Dev profile: prioritize compile speed ──────────────────────────────
[profile.dev]
# Line-tables-only: enough for backtraces, much less data than full debug info
debug = "line-tables-only"
# Split debug info into separate files for faster incremental linking
split-debuginfo = "unpacked"

# Optimize third-party deps even in dev — they rarely change, so the
# one-time cost pays back via faster runtime and smaller link inputs.
# Workspace members inherit [profile.dev] (opt-level 0) and are NOT
# affected by this wildcard override.
[profile.dev.package."*"]
opt-level = 1
debug = false

# ── Release profile: maximize runtime performance ───────────────────────
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
