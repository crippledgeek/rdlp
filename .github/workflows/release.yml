name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }}${{ matrix.args && ' ' || '' }}${{ matrix.args }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@v5

      # --- System dependencies (platform-specific) ---

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Activate MSVC dev environment (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        # See ci.yml for rationale. Required for ffmpeg-sys-the-third's
        # bindgen build script on Windows.

      - name: Cache FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: C:\ffmpeg
          # Pinned — see ci.yml for the rationale.
          key: ffmpeg-win64-shared-8.0

      - name: Download FFmpeg shared build (Windows)
        if: matrix.platform == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-full_build-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg

      - name: Set FFmpeg environment (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\ffmpeg -Directory)[0].FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          echo "$dir\bin" >> $env:GITHUB_PATH

      # See ci.yml — openssl-sys uses `vendored` feature on Windows
      # (declared in crates/rdlp-http/Cargo.toml), so no OpenSSL env needed here.

      # --- Toolchain setup ---

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      # --- Build frontend deps ---

      - name: Install frontend dependencies
        working-directory: crates/rdlp-desktop
        run: npm install

      # --- Tauri build + release ---

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/rdlp-desktop
          tagName: v__VERSION__
          releaseName: 'rdlp v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
