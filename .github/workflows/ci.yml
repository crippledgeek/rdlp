name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check no CLI FFmpeg usage
        run: bash scripts/check-no-cli.sh

      - name: Check no uncapped response.text() reads
        # Fails if any HTTP response body in rdlp-extractor is read via a bare,
        # uncapped `.text().await` instead of the 50 MiB streaming cap
        # `fetch_capped_text` — an adversarial/compromised CDN could otherwise
        # OOM the host with an unbounded body (#438). Multiline-aware; a
        # genuinely-safe test-only loopback read carries an inline
        # `// uncapped-ok: <reason>` marker.
        run: bash scripts/check-no-bare-response-text.sh

      - name: Check URL log redaction
        # Fails if any raw URL is interpolated into an operator-visible string in
        # rdlp-extractor (RdlpError message/reason fields, ctor message-args, log
        # macros, structured-kv fields), the rdlp-postprocess pipeline (fatal-stage
        # `.context(...)` reaching Event::Failed — #422), OR rdlp-api structured-kv
        # log fields (the .expose()-then-log surface — #427). NOTE: rdlp-api error
        # `#[error]`/`format!` `{url}` sites are guarded by the RedactedUrlBuf TYPE
        # + unit tests, NOT by grep (a grep can't tell redacted {url} from raw) —
        # see CODING_RULES.md "URL Redaction — Controls (tiered)".
        # Multiline-aware; credential URLs must be wrapped in
        # rdlp_redact::RedactedUrl / rdlp_security::sanitize_for_logging (#328/#392/#422/#427).
        run: bash scripts/check-url-redaction.sh

      - name: Check WIT vendor drift
        # The example-extractor plugin vendors a byte-copy of the host's WIT
        # contract under examples/plugins/example-extractor/wit/deps/rdlp-plugin.
        # `cargo-component` requires it for plugin builds, but it has no
        # automatic refresh — a host WIT bump that forgets to sync the vendored
        # copy ships an MVP plugin compiled against an older contract.
        # Diff guard: if the host WIT and vendored copy diverge, fail loud.
        run: bash scripts/check-wit-drift.sh

      - name: Check Rust enum / TypeScript union drift
        # crates/rdlp-desktop/src/types/index.ts hand-mirrors several lowercase
        # serde enums from rdlp-types. Adding a Rust variant does not break the
        # TS build — it just lets Rust serialize a value the TS type declares
        # impossible (#534 added ContainerFormat::M4v; the union kept 28, #542).
        # Derives the Rust side from the enum body, so it can't agree with a
        # stale mirror.
        run: bash scripts/check-ts-enum-drift.sh

      - name: Check no directory-sweep deletion
        # #558: deleting files found by scanning a directory cannot tell "a file
        # rdlp created" from "a file the user already had". CERT FIO21-C; no
        # comparable tool (yt-dlp/aria2/curl/wget/rsync) deletes by pattern match.
        run: bash scripts/check-no-dir-sweep-delete.sh

      - name: Verify the dir-sweep gate still fires
        # Scans a synthetic sweep in a temp dir. Without this, "canary-verified"
        # decays into an unchecked claim as the matcher evolves.
        run: bash scripts/check-no-dir-sweep-delete.sh --self-test

      - name: Install semgrep
        run: pipx install semgrep || pip install semgrep

      - name: Check log-field URL redaction (Semgrep gate)
        # Tier-2 backstop (#428): flags any raw `url = <x>` in a `log` macro that
        # the type-level RedactedUrl guard didn't force. Sanitizer-aware (Semgrep
        # generic mode) — treats RedactedUrl::new()/RedactedUrlBuf/sanitize_for_logging
        # (incl. qualified rdlp_redact::* / rdlp_security::* forms) as sanitizers.
        env:
          RDLP_REQUIRE_SEMGREP: "1"
        run: bash scripts/check-log-redaction.sh

  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # --- System dependencies (platform-specific) ---

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # FFmpeg dev libs come from BtbN/FFmpeg-Builds (GitHub-hosted) instead
          # of a Launchpad PPA — Launchpad PPAs go down whenever Canonical is
          # under DDoS, taking the whole CI matrix with them.
          #
          # Upgrade path: when a new major (e.g. n9.0) is needed, bump FFMPEG_TAG
          # below. Tags follow `n<MAJOR>.<MINOR>` upstream
          # (https://github.com/BtbN/FFmpeg-Builds/releases/latest). Stick to
          # `lgpl-shared` to avoid pulling in GPL-licensed FFmpeg components.
          FFMPEG_TAG=n8.1
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-${FFMPEG_TAG}-latest-linux64-lgpl-shared-${FFMPEG_TAG#n}.tar.xz"
          curl -fsSL "$FFMPEG_URL" | sudo tar xJ -C /usr/local --strip-components=1
          # Ubuntu 22.04 doesn't include /usr/local/lib in the default ld.so
          # config or pkg-config search path; expose both so cargo's linker
          # and ffmpeg-sys-the-third's build script find the FFmpeg libs.
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/usr-local.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            perl \
            libclang-dev \
            musl-tools
        # Note: pkg-config dropped — runner's preinstalled pkgconf provides
        # the same interface and Breaks pkg-config (>= 0.29-1) via apt.

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Activate MSVC dev environment (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        # Sets INCLUDE / LIB / PATH so clang (invoked by ffmpeg-sys-the-third's
        # bindgen build script) can find the Windows SDK + STL headers.
        # Without this, bindgen's clang invocation hits
        # STATUS_ACCESS_VIOLATION (0xc0000005) parsing FFmpeg's transitive
        # system headers — which is the root cause of upstream
        # shssoichiro/ffmpeg-the-third#145.

      - name: Install pinned LLVM 18 (Windows)
        if: matrix.platform == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm
        # `clang-sys` (used by bindgen) loads libclang.dll at runtime. The
        # `windows-latest` image bumped to clang 20.1.x in late 2026-04 and
        # both the system clang (PATH-resolved) and the VS-bundled clang
        # (under VC\Tools\LLVM) crash parsing FFmpeg 8.0 headers — first as
        # STATUS_STACK_BUFFER_OVERRUN (0xc0000409 = __fastfail/abort, see
        # https://devblogs.microsoft.com/oldnewthing/20190108-00/?p=100655),
        # then as STATUS_ACCESS_VIOLATION (0xc0000005, upstream issue
        # shssoichiro/ffmpeg-the-third#145 failure pattern #2). Pinning to
        # LLVM 18.1.8 — long-validated against bindgen 0.72 + FFmpeg 8.0 —
        # eliminates the runner-image dependency entirely.

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $libclang = Join-Path $env:LLVM_PATH "bin"
          if (-not (Test-Path "$libclang\libclang.dll")) {
            throw "libclang.dll not found at $libclang"
          }
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$libclang"

      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Cache FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: C:\ffmpeg
          # Pinned to a specific FFmpeg 8.0 build because ffmpeg-sys-the-third
          # v4.1.0+ffmpeg-8.0 declares 8.0 bindings; FFmpeg 8.1 headers
          # crash clang/bindgen on Windows (STATUS_ACCESS_VIOLATION).
          # Bump key whenever the FFmpeg version below changes.
          key: ffmpeg-win64-shared-8.0

      - name: Download FFmpeg shared build (Windows)
        if: matrix.platform == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-full_build-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg

      - name: Set FFmpeg environment (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\ffmpeg -Directory)[0].FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          echo "$dir\bin" >> $env:GITHUB_PATH

      # No OpenSSL env var needed on Windows: openssl-sys is enabled with
      # the `vendored` feature for windows targets in crates/rdlp-http/Cargo.toml,
      # so it compiles OpenSSL from source instead of looking for system libs.

      # --- Toolchain setup ---

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          # NOTE: built-in `cache: 'npm'` requires a TRACKED lockfile.
          # `crates/rdlp-desktop/package-lock.json` is in .gitignore by
          # project policy, so setup-node's cache hash fails to resolve
          # and the action errors out. Re-enable IF the project ever
          # tracks its lockfile.

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Share one cache pool per platform across all branches/PRs so
          # cold-cache rebuilds of boring-sys (multi-minute C++ build) and
          # the workspace tree don't repeat on every PR. Cache is keyed by
          # platform + Cargo.lock + rustc version under the hood.
          shared-key: rust-${{ matrix.platform }}

      # --- Fast linker (rust-lld bundled with Rust, lld via apt) ---

      - name: Configure fast linker (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y lld
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nlinker = "clang"\nrustflags = ["-Clink-arg=-fuse-ld=lld"]\n' >> .cargo/config.toml

      - name: Configure fast linker (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-pc-windows-msvc]\nlinker = "rust-lld"\n' >> .cargo/config.toml

      # --- Desktop frontend (must build before any Rust pass, because
      #     rdlp-desktop's tauri build script reads dist/ via tauri.conf.json) ---

      # Cache npm's tarball cache. setup-node's built-in `cache: 'npm'`
      # requires a tracked `package-lock.json` — the project doesn't track
      # one (per the comment on the setup-node step above), so we cache the
      # tarball directory directly via actions/cache@v5. Keys on the
      # crates/rdlp-desktop/package.json hash; falls back to any
      # platform-matched cache via restore-keys.
      #
      # Without this step, every CI run does a fresh `npm install` against
      # the npm registry, which intermittently fails on Windows runners
      # (registry redirect / DNS / antivirus scanning) — observed on
      # PR #297 CI run 25398198158.
      #
      # The cache path is queried via `npm config get cache` to avoid the
      # earlier-PR-#299 Windows mistake (hardcoded `~\AppData\Local\npm-cache`
      # is wrong — Windows default is `%APPDATA%\npm-cache` at
      # `~\AppData\Roaming\npm-cache`, not Local). `npm config get cache` is
      # authoritative across platforms and respects any project `.npmrc`.
      - name: Resolve npm cache path
        id: npm-cache-path
        shell: bash
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm tarball cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-path.outputs.path }}
          key: ${{ runner.os }}-npm-${{ hashFiles('crates/rdlp-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: crates/rdlp-desktop
        run: npm install

      - name: Build frontend
        working-directory: crates/rdlp-desktop
        run: npx vite build

      - name: Frontend type check and tests
        working-directory: crates/rdlp-desktop
        run: |
          npx tsc --noEmit
          npm test

      # --- Single workspace lint & test pass (covers libs + CLI + desktop +
      #     probe; eliminates the prior double-compile of the shared dep tree
      #     that happened when desktop was a second pass). ---

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  # Path-filter to avoid running the expensive golden build (~12 min;
  # apt-install + componentize-py 0.17.2 + 3 × 35 MB wasm builds) on commits
  # that can't possibly affect its outputs. Runs unconditionally on push
  # (merges to develop) so the protected-branch state is always validated.
  golden-filter:
    name: Should run yt-dlp golden?
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.f.outputs.golden }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            golden:
              - 'tools/ytdlp-compat/**'
              - 'crates/rdlp-cli/src/plugin_cmd/build_from_ytdlp.rs'
              - 'crates/rdlp-cli/src/plugin_cmd.rs'
              - 'crates/rdlp-cli/src/args.rs'
              - 'crates/rdlp-cli/src/main.rs'
              - 'crates/rdlp-plugin/wit/**'
              - 'crates/rdlp-plugin/src/host/**'
              - 'crates/rdlp-plugin-manifest/src/**'
              # Glob-everything so each new ported plugin (Slice 2.5+)
              # auto-triggers without per-plugin CI edits. Plugins live
              # under examples/plugins/<name>/, fixtures under
              # crates/rdlp-plugin/tests/fixtures/<name>/, and the
              # integration golden at tests/<name>_golden.rs.
              - 'examples/plugins/**'
              - 'crates/rdlp-plugin/tests/*_golden.rs'
              - 'crates/rdlp-plugin/tests/fixtures/**'
              - '.github/workflows/ci.yml'

  ytdlp-plugin-golden:
    name: Run Golden Build
    needs: [golden-filter]
    # `build-and-test` was previously a `needs:` dependency to gate Golden
    # behind cross-platform compile success. We dropped it because:
    #
    # 1. Golden runs on ubuntu-22.04. Linux compile failures surface as
    #    Golden failures directly — the matrix dependency added no signal
    #    on top of that.
    # 2. Windows is the slowest matrix shard (~11m). Golden waited the
    #    extra ~7m for Windows after ubuntu/macos finished, every push,
    #    even when Windows had nothing to do with the change. That's a
    #    Golden-side cost paid for cross-platform parity that Golden
    #    doesn't exercise.
    # 3. Windows-only or macOS-only build failures are still caught
    #    independently by the matrix's own status check.
    #
    # Always run on push (merges into develop) and on workflow_dispatch
    # (manual reruns must exercise the golden — that's the one case where
    # you most want it). On PR, run only when the filter caught a relevant
    # change. Skipping is the desired outcome on PRs that touch unrelated
    # code, not a failure.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.golden-filter.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # The golden test invokes `cargo run -p rdlp-cli` which transitively
      # depends on ffmpeg-sys-the-third — same dev libs the matrix job needs.
      - name: Install system dependencies (Linux)
        run: |
          # FFmpeg dev libs come from BtbN/FFmpeg-Builds (GitHub-hosted) instead
          # of a Launchpad PPA — Launchpad PPAs go down whenever Canonical is
          # under DDoS, taking the whole CI matrix with them.
          #
          # Upgrade path: when a new major (e.g. n9.0) is needed, bump FFMPEG_TAG
          # below. Tags follow `n<MAJOR>.<MINOR>` upstream
          # (https://github.com/BtbN/FFmpeg-Builds/releases/latest). Stick to
          # `lgpl-shared` to avoid pulling in GPL-licensed FFmpeg components.
          FFMPEG_TAG=n8.1
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-${FFMPEG_TAG}-latest-linux64-lgpl-shared-${FFMPEG_TAG#n}.tar.xz"
          curl -fsSL "$FFMPEG_URL" | sudo tar xJ -C /usr/local --strip-components=1
          # Ubuntu 22.04 doesn't include /usr/local/lib in the default ld.so
          # config or pkg-config search path; expose both so cargo's linker
          # and ffmpeg-sys-the-third's build script find the FFmpeg libs.
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/usr-local.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake \
            perl \
            libclang-dev \
            musl-tools

      # uv is Astral's pip-replacement; ~10x faster wheel install + first-
      # class --require-hashes support. setup-uv installs Python via
      # `uv python install` automatically when `--python 3.12` is requested
      # by `uv venv`, so a separate actions/setup-python@v5 is redundant
      # (and adds an extra third-party action to the trust surface for no
      # gain — security review L2 from PR #221 wave 3).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/ytdlp-compat/requirements-dev.txt

      # Cache the Python venv itself (not just uv's download cache).
      # uv's cache lives at ~/.cache/uv and is handled by setup-uv's
      # enable-cache. The venv directory under tools/ytdlp-compat/.venv
      # is a separate concern — it holds the symlinked/installed
      # `componentize-py` binary + the editable rdlp_ytdlp_compat
      # package. Caching it keyed on the lockfile hash skips the venv
      # creation + install steps when deps haven't changed.
      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: tools/ytdlp-compat/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('tools/ytdlp-compat/requirements-dev.txt') }}

      # Idempotent ensure-venv. uv-created venvs contain a symlink at
      # .venv/bin/python pointing at an absolute path on the runner; when
      # GitHub rotates the runner image, that path can disappear and the
      # symlink dangles. The requirements-dev.txt hash is unchanged so
      # the cache restores, but every shebang'd entry-point then fails
      # with "bad interpreter: No such file or directory". This step
      # validates the restored venv and rebuilds it in place if the
      # interpreter symlink is broken — keeping the cache-hit fast path
      # intact for healthy caches while self-healing on stale ones.
      - name: Ensure componentize-py-pin@0.17.2 venv
        working-directory: tools/ytdlp-compat
        run: |
          if .venv/bin/python --version >/dev/null 2>&1 \
             && .venv/bin/componentize-py --version >/dev/null 2>&1; then
            echo "Cached venv is healthy"
          else
            echo "::warning::Rebuilding venv (no cache hit, or interpreter symlink stale)"
            rm -rf .venv
            uv venv .venv --python 3.12
            uv pip install --python .venv/bin/python \
              --require-hashes -r requirements-dev.txt
          fi
          .venv/bin/componentize-py --version

      - name: Run rdlp_ytdlp_compat unit tests
        working-directory: tools/ytdlp-compat
        run: |
          uv pip install --python .venv/bin/python -e .
          .venv/bin/pytest tests/ -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: rust-ubuntu-22.04

      # Cache componentize-py wasm artifacts produced by each `*_golden.rs`
      # test's `build_*_plugin()` helper. Each plugin's wasm is a function
      # of:
      #   - the plugin's `.py` source (per-plugin),
      #   - componentize-py version (pinned via requirements-dev.txt),
      #   - the WIT contract,
      #   - the rdlp-side compat shim and build-from-ytdlp wrapper.
      # If any of those change, the cache key flips and we rebuild every
      # plugin. Otherwise we restore the prior wasm and skip the
      # ~30s componentize-py compile per plugin (3 ytdlp-goldens + svt +
      # xxxymovies = 5 plugins ≈ 150s saved on cache hit).
      #
      # The test-side helpers (svt_golden::build_svt_plugin etc.) honour
      # the `RDLP_TEST_USE_CACHED_WASM=1` env var: when set AND the wasm
      # exists, they skip the rebuild and return the cached path. Local
      # `cargo test` runs never set this env var, so the rebuild path
      # remains the default — correctness over speed by default.
      - name: Cache golden wasm artefacts
        id: golden-wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            examples/plugins/svt/svt
            examples/plugins/xxxymovies/xxxymovies
            examples/plugins/ytdlp-golden/simple-html
            examples/plugins/ytdlp-golden/json-traversal
            examples/plugins/ytdlp-golden/m3u8-with-fallback
            examples/plugins/mpd-golden/mpd-golden
          key: golden-wasm-${{ runner.os }}-${{ hashFiles('tools/ytdlp-compat/requirements-dev.txt', 'tools/ytdlp-compat/rdlp_ytdlp_compat/**/*.py', 'crates/rdlp-cli/src/plugin_cmd/build_from_ytdlp.rs', 'crates/rdlp-plugin/wit/**/*.wit', 'examples/plugins/svt/svt.py', 'examples/plugins/xxxymovies/xxxymovies.py', 'examples/plugins/ytdlp-golden/*.py', 'examples/plugins/mpd-golden/mpd_golden.py') }}

      - name: Run all goldens
        # Iterates every `crates/rdlp-plugin/tests/*_golden.rs` file —
        # each new ported plugin (Slice 2.5+) auto-runs without CI
        # edits. Tests inside golden files are `#[ignore]` (slow:
        # ~30s componentize-py wasm build per plugin), so we explicitly
        # pass --ignored. Sequential execution (one cargo test
        # invocation per file) avoids parallel wasm builds saturating
        # disk + CPU on the runner.
        #
        # `RDLP_TEST_USE_CACHED_WASM=1` opts the test helpers into the
        # cache short-circuit — only takes effect on a cache hit, since
        # the helpers re-check `wasm.exists()` before honouring the env.
        timeout-minutes: 30
        env:
          RDLP_TEST_USE_CACHED_WASM: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          goldens=(crates/rdlp-plugin/tests/*_golden.rs)
          if [ ${#goldens[@]} -eq 0 ]; then
            echo "::error::no *_golden.rs files found"
            exit 1
          fi
          for f in "${goldens[@]}"; do
            name=$(basename "$f" .rs)
            echo "::group::Run $name"
            cargo test -p rdlp-plugin --test "$name" -- --ignored --nocapture
            echo "::endgroup::"
          done
