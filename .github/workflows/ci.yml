name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check no CLI FFmpeg usage
        run: bash scripts/check-no-cli.sh

  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # --- System dependencies (platform-specific) ---

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            cmake \
            perl \
            pkg-config \
            libclang-dev \
            musl-tools

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Cache FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: C:\ffmpeg
          key: ffmpeg-win64-shared-7

      - name: Download FFmpeg shared build (Windows)
        if: matrix.platform == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg

      - name: Set FFmpeg environment (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\ffmpeg -Directory)[0].FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          echo "$dir\bin" >> $env:GITHUB_PATH

      # --- Toolchain setup ---

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      # --- Fast linker (rust-lld bundled with Rust, lld via apt) ---

      - name: Configure fast linker (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y lld
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nlinker = "clang"\nrustflags = ["-Clink-arg=-fuse-ld=lld"]\n' >> .cargo/config.toml

      - name: Configure fast linker (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-pc-windows-msvc]\nlinker = "rust-lld"\n' >> .cargo/config.toml

      # --- Workspace lint & test (default members: libs + CLI) ---

      - name: Clippy (workspace)
        run: cargo clippy -- -D warnings

      - name: Test (workspace)
        run: cargo test

      # --- Desktop frontend (must build before Rust desktop checks) ---

      - name: Install frontend dependencies
        working-directory: crates/rdlp-desktop
        run: npm install

      - name: Build frontend
        working-directory: crates/rdlp-desktop
        run: npx vite build

      - name: Frontend type check and tests
        working-directory: crates/rdlp-desktop
        run: |
          npx tsc --noEmit
          npm test

      # --- Desktop Rust backend (requires frontend dist/) ---

      - name: Clippy (desktop)
        run: cargo clippy -p rdlp-desktop -- -D warnings

      - name: Test (desktop)
        run: cargo test -p rdlp-desktop
