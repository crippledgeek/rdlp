# ──────────────────────────────────────────────────────────────────────
# Test-code lint policy
#
# `unwrap()` / `expect()` are idiomatic in tests (see BurntSushi,
# https://burntsushi.net/unwrap/). These two flags opt inline
# `#[cfg(test)]` and `#[test]` items out of `unwrap_used` and
# `expect_used` so production code stays gated while tests can panic
# on failure.
#
# Known clippy limitation: integration tests under `crates/*/tests/*.rs`
# are NOT covered because they aren't seen as `#[cfg(test)]` by these
# checks (rust-clippy#13981, #9062, #9612). Those files keep a single
# file-scope `#![allow(clippy::unwrap_used, clippy::expect_used)]` with
# the upstream-bug citation; do NOT extend the allow list beyond those
# two lints there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# ──────────────────────────────────────────────────────────────────────
# Async-correctness gate (Phase 1.5)
#
# These std::fs APIs are blocking and must not appear in async fn bodies.
# Per-site `#[allow(clippy::disallowed_methods)]` is accepted ONLY at:
#   (a) FFmpeg / rusqlite wrappers inside spawn_blocking,
#   (b) Tauri / CLI startup code that runs before any concurrent work,
#   (c) test fixtures and build.rs.
#
# Research basis: docs/implementation/tls-impersonation/phase-1-report.md
# Appendix C. Pattern: Embark's rust-ecosystem + Oxide's oxide-tokio-rt.

disallowed-methods = [
    { path = "std::fs::create_dir_all", reason = "blocking in async context — use tokio::fs::create_dir_all or spawn_blocking" },
    { path = "std::fs::read_dir", reason = "blocking in async context — use tokio::fs::read_dir or spawn_blocking" },
    { path = "std::fs::read", reason = "blocking in async context — use tokio::fs::read or spawn_blocking" },
    { path = "std::fs::read_to_string", reason = "blocking in async context — use tokio::fs::read_to_string or spawn_blocking" },
    { path = "std::fs::write", reason = "blocking in async context — use tokio::fs::write or spawn_blocking" },
    { path = "std::fs::remove_file", reason = "blocking in async context — use tokio::fs::remove_file or spawn_blocking" },
    { path = "std::fs::remove_dir_all", reason = "blocking in async context — use tokio::fs::remove_dir_all or spawn_blocking" },
    { path = "std::fs::rename", reason = "blocking in async context — use tokio::fs::rename or spawn_blocking" },
    { path = "std::fs::metadata", reason = "blocking in async context — use tokio::fs::metadata or spawn_blocking" },
    { path = "std::fs::File::open", reason = "blocking in async context — use tokio::fs::File::open or spawn_blocking" },
    { path = "std::fs::File::create", reason = "blocking in async context — use tokio::fs::File::create or spawn_blocking" },
]

# ──────────────────────────────────────────────────────────────────────
# Parameter naming standards (PR C, spec 2026-05-21-code-quality-sprint-design.md):
# - max-fn-params-bools = 2 caps bool-parameter count at 2; pairs with the
#   workspace lint `fn_params_excessive_bools = "warn"` (Task 8). Baseline:
#   0 violations after P3 struct extraction (build_convert_options).
# - too-many-arguments-threshold deliberately NOT lowered from clippy's
#   default 7. Setting it to 5 (per Rule P2's guidance for new code) would
#   fire 38 pre-existing warnings; refactoring each requires a struct
#   extraction with TDD and caller updates, out of scope for PR C.
#   CODING_RULES.md P2 remains the advisory guide for new code; reviewers
#   enforce the spirit of the rule during PR review.
max-fn-params-bools = 2

# ──────────────────────────────────────────────────────────────────────
# Function-length policy (spec 2026-05-22-file-cohesion-policy-design.md).
# Threshold 150 is tighter than community norm (200) but looser than
# the default 100; chosen because Rust's denser syntax makes 100 too
# tight for legitimate setup-call-cleanup patterns. Per-function
# `#[allow(clippy::too_many_lines)]` is permitted with a `// reason:`
# comment naming the structural justification.
too-many-lines-threshold = 150
